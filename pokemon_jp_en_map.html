
<style>
  .search-bar { width: 100%; box-sizing: border-box; margin-bottom: 1rem; padding: 8px 12px; font-size: 14px; }
  .poke-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .poke-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .poke-num { font-size: 11px; color: var(--color-text-tertiary); font-family: var(--font-mono); }
  .poke-jp { font-size: 17px; font-weight: 500; color: var(--color-text-primary); }
  .poke-en { font-size: 13px; color: var(--color-text-secondary); }
  .type-badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: var(--border-radius-md); margin-top: 4px; font-weight: 500; }
  .no-results { color: var(--color-text-secondary); font-size: 14px; padding: 1rem 0; }
  .count-label { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 10px; }
</style>

function renderCards(list) {
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  count.textContent = list.length + ' Pokémon';
  if (!list.length) {
    grid.innerHTML = '<p class="no-results">No results found.</p>';
    return;
  }
  grid.innerHTML = list.map(p => {
    const c = typeColors[p.type] || {bg:"#D3D1C7",text:"#444441"};
    return `<div class="poke-card">
      <span class="poke-num">#${p.num}</span>
      <span class="poke-jp">${p.jp}</span>
      <span class="poke-en">${p.en}</span>
      <span class="type-badge" style="background:${c.bg};color:${c.text}">${p.type}</span>
    </div>`;
  }).join('');
}

function filterPokemon() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = q ? pokemon.filter(p =>
    p.jp.includes(q) || p.en.toLowerCase().includes(q) || p.num.includes(q) || p.type.includes(q)
  ) : pokemon;
  renderCards(filtered);
}
